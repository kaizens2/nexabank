server:
  port: 8080

spring:
  application:
    name: nexabank-api-gateway

  config:
    import: configserver:http://localhost:8888

  cloud:
    gateway:
      server:
        webmvc:                              # ← this is the key fix for webmvc gateway
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**

            - id: account-service
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**

            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**

            - id: fraud-service
              uri: lb://fraud-service
              predicates:
                - Path=/api/fraud/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**

            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/api/audit/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: TRACE