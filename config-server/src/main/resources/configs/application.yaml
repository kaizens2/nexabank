# Shared across ALL services
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    env:
      show-values: always
    web:
      exposure:
        include: "*"
    tracing:
      sampling:
        probability: 1.0
      export:
        zipkin:
          endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
    include-application-name: false

spring:
  jpa:
    hibernate:
      ddl-auto: validate    # ← Hibernate only validates, Flyway owns schema