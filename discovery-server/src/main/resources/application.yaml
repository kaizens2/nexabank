server:
  port: 8761

spring:
  application:
    name: nexabank-discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    # This is the server itself ? it should NOT register with itself
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # Wait time before evicting unavailable instances (lower for dev)
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, info