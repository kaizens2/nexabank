# Shared across ALL services
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, refresh
  tracing:
    sampling:
      probability: 1.0

spring:
  jpa:
    hibernate:
      ddl-auto: validate    # ← Hibernate only validates, Flyway owns schema
  flyway:
    enabled: true
    locations: classpath:db/migration